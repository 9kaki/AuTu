name: Preview Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Verify LibCore
        working-directory: core
        run: |
          go vet . ./cmd/...

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME || secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS || secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            {
              echo "storePassword=${KEYSTORE_PASS}"
              echo "keyAlias=${ALIAS_NAME:-outo}"
              echo "keyPassword=${ALIAS_PASS:-$KEYSTORE_PASS}"
            } > android/local.properties
            echo "Unified release keystore restored from repository secrets."
          else
            echo "::error::Release signing credentials (KEYSTORE_BASE64 / KEYSTORE_PASS) missing in GitHub Secrets. Refusing to build without unified signing key."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart android

      - name: Cleanup Signing Secrets
        if: always()
        run: |
          rm -f android/app/keystore.jks android/local.properties

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ./dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish Preview Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version
        run: |
          PRE_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1 | tr -d '\r\n')
          echo "PRE_VERSION=$PRE_VERSION" >> $GITHUB_ENV

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts

      - name: Prepare APKs and Checksums
        run: |
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks/ \;
          cd apks
          sha256sum *.apk > sha256sums.txt
          cd ..
          ls -la apks/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PRE_VERSION }}
          name: OuTo v${{ env.PRE_VERSION }}
          files: |
            apks/*.apk
            apks/sha256sums.txt
          draft: false
          prerelease: true
          make_latest: false